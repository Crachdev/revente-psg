.hd{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.hd>div{min-width:0}
.sw{flex:none;display:inline-flex;align-items:center;gap:8px;min-height:36px;padding:0 4px 0 10px;border:1px solid var(--line);border-radius:999px;background:var(--surface);color:var(--muted);font:600 12px var(--f-body);letter-spacing:.04em;text-transform:uppercase;cursor:pointer}
.swl{min-width:46px;text-align:right}
.sw i{display:block;width:34px;height:20px;border-radius:999px;background:var(--surface-2);border:1px solid var(--line);position:relative}
.sw i::after{content:"";position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;background:var(--muted);transition:transform .15s}
.sw[aria-checked="true"] i{background:var(--accent)}
.sw[aria-checked="true"] i::after{transform:translateX(14px);background:var(--accent-ink)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);position:relative;color:var(--ink);font:15px/1.45 var(--f-body);-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0;z-index:0;pointer-events:none;background:var(--wm) center 55%/min(78vw,430px) no-repeat;opacity:var(--wmo,.1)}
.wrap{position:relative;z-index:1}
.wrap{max-width:720px;margin:0 auto;padding-block:20px 56px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:20px}
h1,h2,.h2{font-family:var(--f-display);margin:0;text-wrap:balance;text-transform:uppercase}
h1{font-size:36px;line-height:1;font-weight:700;letter-spacing:.01em}
h2,.h2{font-size:22px;line-height:1.1;font-weight:600;letter-spacing:.03em}
p{margin:0}
.sub{color:var(--muted);margin-top:6px}
.muted{color:var(--muted)}
a{color:var(--accent)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.panel>.sub{margin-top:0}
.btn{display:flex;align-items:center;justify-content:center;min-height:52px;padding:0 18px;border-radius:10px;border:1px solid var(--accent);background:var(--accent);color:var(--accent-ink);font:600 16px/1.2 var(--f-body);text-decoration:none;cursor:pointer;text-align:center}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line);min-height:44px;font-size:15px}
.btn.small{min-height:38px;padding:0 12px;font-size:14px}
.btn:disabled{opacity:.5;cursor:not-allowed}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.cta-row{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px}
.links{font-size:14px;color:var(--muted)}
.list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.todo-item{display:grid;grid-template-columns:96px minmax(0,1fr);gap:10px;align-items:start;width:100%;padding:12px 0;border:0;border-top:1px solid var(--line);background:none;color:inherit;font:inherit;text-align:left;cursor:pointer}
.list li:first-child .todo-item{border-top:0;padding-top:4px}
.tag{display:inline-block;padding:2px 8px;border-radius:999px;font-size:12px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;text-align:center;justify-self:start}
.tag.crit{background:var(--crit-soft);color:var(--crit)}
.tag.warn{background:var(--warn-soft);color:var(--warn)}
.tag.accent{background:var(--accent-soft);color:var(--accent)}
.tag.neutral{background:var(--surface-2);color:var(--muted)}
.fixtures{display:flex;flex-direction:column;gap:10px}
details.fx,div.fx{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
details.fx>summary,div.fx>.sum{list-style:none;display:grid;grid-template-columns:64px minmax(0,1fr) auto 30px;cursor:pointer;align-items:stretch}
details.fx>summary::-webkit-details-marker{display:none}
.stub{border-right:2px dashed var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:12px 0;font-family:var(--f-display)}
.stub b{font-size:32px;line-height:1;font-weight:700}
.stub i{font-style:normal;text-transform:uppercase;font-size:13px;letter-spacing:.08em;color:var(--muted)}
.main{padding:12px;min-width:0;display:flex;flex-direction:column;gap:2px;justify-content:center}
.clogo{width:26px;height:26px;object-fit:contain;flex:none}
.opp{display:inline-flex;align-items:center;gap:8px;font-family:var(--f-display);font-size:24px;line-height:1.05;font-weight:600;text-transform:uppercase;letter-spacing:.02em}
.meta{font-size:13px;color:var(--muted)}
.j{font-weight:600;color:var(--ink);font-variant-numeric:tabular-nums}
.side{padding:12px 0 12px 4px;display:flex;flex-direction:column;align-items:flex-end;justify-content:center;gap:3px;text-align:right}

<script>

/* ---------- utilitaires ---------- */
function users(){return (CFGX.USERS||[]).filter(function(u){return u&&u.name&&u.email;});}
var selUser='', pwMsg=null, rst=null, pushMsg=null, syncErr=false;
function lastUser(){if(selUser)return selUser;try{return localStorage.getItem('psg_last_user')||'';}catch(e){return '';}}
function whoFromEmail(em){
  var m=users().filter(function(u){return u.email.toLowerCase()===String(em||'').toLowerCase();})[0];
  return m?m.name:(em||'?');
}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function num(v){if(v===null||v===undefined||v==='')return null;var n=Number(String(v).replace(',','.'));return isFinite(n)?n:null;}
function N(v){return Number(v)||0;}
function nz(v,d){var n=num(v);return n==null?d:n;}
function eur(n){if(n==null)return '—';return new Intl.NumberFormat('fr-FR',{style:'currency',currency:'EUR',minimumFractionDigits:Number.isInteger(n)?0:2,maximumFractionDigits:2}).format(n);}
function parseD(s){var p=String(s).split('-').map(Number);return Date.UTC(p[0],p[1]-1,p[2]);}

  var parts=new Intl.DateTimeFormat('en-GB',{timeZone:'Europe/Paris',year:'numeric',month:'2-digit',day:'2-digit'}).formatToParts(new Date());
  function g(t){return parts.filter(function(x){return x.type===t;})[0].value;}
  return g('year')+'-'+g('month')+'-'+g('day');
}
function monShort(d){return new Intl.DateTimeFormat('fr-FR',{month:'short',timeZone:'UTC'}).format(d).replace('.','');}

  var t=new Date(iso).getTime();if(isNaN(t))return '';

  var m=Math.round(s/60);if(m<60)return 'il y a '+m+' min';

function find(id){return matches.filter(function(x){return x.id===id;})[0];}

/* ---------- grille de prix : ouverture, puis J-7, J-3, J-1 (plancher) ---------- */
function plan(m,J){
  var base=num(m.paid); if(base==null) base=num(cfg.basePrice);
  if(base==null) return null;
  var floorV=num(m.floor); if(floorV==null) floorV=Math.round(base*N(cfg.floorPct)/100);
  var openP=Math.round(base*(1+N(cfg.markup)/100));
  function at(j){
    var p;
    if(j<=1)p=floorV; else if(j<=3)p=openP*(1-N(cfg.drop3)/100); else if(j<=7)p=openP*(1-N(cfg.drop7)/100); else p=openP;
    return Math.max(floorV,Math.round(p));
  }
  var next=null,steps=[7,3,1];
  for(var i=0;i<steps.length;i++){if(steps[i]<J){next={t:steps[i],inDays:J-steps[i],price:at(steps[i])};break;}}
  return {now:at(J),next:next,tiers:[
    {k:'Ouverture',cur:J>7,price:at(99)},{k:'J-7',cur:J<=7&&J>3,price:at(7)},
    {k:'J-3',cur:J<=3&&J>1,price:at(3)},{k:'J-1',cur:J<=1,price:at(1)}]};
}

function buildTodo(rows){
  var items=[];
  rows.forEach(function(r){
    var m=r.m,J=r.J,p=r.p;
    if(m.status==='vendue'||m.status==='gardee')return;
    if(m.status==='ouverte'){
      items.push({pr:0,tag:'À poster',cls:'crit',id:m.id,J:J,text:m.opp+' : la revente est ouverte. '+(p?'Mets la paire en vente à '+eur(p.now)+'.':'Renseigne un prix de base pour voir le prix conseillé.')});
    }else if(m.status==='enligne'){
      var L=num(m.listed);
      if(p&&L!=null&&p.now<L)items.push({pr:1,tag:'Baisser',cls:'warn',id:m.id,J:J,text:m.opp+' : passe de '+eur(L)+' à '+eur(p.now)+' ('+jLabel(J)+').'});
      else if(p&&L==null)items.push({pr:3,tag:'Noter',cls:'neutral',id:m.id,J:J,text:m.opp+' : note le prix affiché pour suivre les baisses.'});
    }else if(m.status==='attente'&&J<=N(cfg.watchFrom)){
      items.push({pr:2,tag:'Surveiller',cls:'accent',id:m.id,J:J,text:m.opp+' : revente pas encore vue ('+jLabel(J)+').'});
    }
  });
  items.sort(function(a,b){return a.pr-b.pr||a.J-b.J;});
  return items.slice(0,6);
}

var STADE='Parc des Princes, 24 rue du Commandant Guilbaud, 75016 Paris';
function parisOff(t){var p=new Intl.DateTimeFormat('en-GB',{timeZone:'Europe/Paris',hour12:false,year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'}).formatToParts(new Date(t)),o={};p.forEach(function(x){o[x.type]=x.value;});return (Date.UTC(+o.year,+o.month-1,+o.day,(+o.hour)%24,+o.minute)-t)/60000;}
function parisUtc(d,hh,mm){var a=String(d).split('-').map(Number),g=Date.UTC(a[0],a[1]-1,a[2],hh,mm),u=g-parisOff(g)*60000;u=g-parisOff(u)*60000;return new Date(u);}

function evOf(m){
  var timed=!m.weekend&&/^\d{1,2}:\d{2}$/.test(String(m.time||'')),title='PSG – '+m.opp,desc='Abonnement PSG. Pensez à vérifier si la revente est ouverte'+(m.weekend||!timed?' (horaire du match à confirmer).':'.');
  var e={title:title,desc:desc,loc:STADE,uid:m.id+'@revente-psg',timed:timed};
  if(timed){var t=String(m.time).split(':').map(Number);e.start=parisUtc(m.date,t[0],t[1]);e.end=new Date(e.start.getTime()+2*3600000);}
  else{e.day=icsDay(m.date,0);e.dayEnd=icsDay(m.date,1);}
  var al=parisUtc(addDaysStr(m.date,-7),10,0);if(al.getTime()>Date.now())e.alarm=al;
  return e;
}
function addDaysStr(d,n){var a=String(d).split('-').map(Number);return new Date(Date.UTC(a[0],a[1]-1,a[2]+n)).toISOString().slice(0,10);}
function gcalUrl(m){
  var e=evOf(m),dates=e.timed?icsStamp(e.start)+'/'+icsStamp(e.end):e.day+'/'+e.dayEnd;
  return 'https://calendar.google.com/calendar/render?action=TEMPLATE&text='+encodeURIComponent(e.title)+'&dates='+dates+'&details='+encodeURIComponent(e.desc)+'&location='+encodeURIComponent(e.loc);
}
function icsEsc(t){return String(t).replace(/\\/g,'\\\\').replace(/;/g,'\;').replace(/,/g,'\\,').replace(/\n/g,'\\n');}
function icsFold(l){var o=[];while(l.length>72){o.push(l.slice(0,72));l=' '+l.slice(72);}o.push(l);return o.join('\r\n');}
function buildIcs(list){
  var L=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Revente PSG//FR','CALSCALE:GREGORIAN','METHOD:PUBLISH','X-WR-CALNAME:PSG à domicile'],now=icsStamp(new Date());
  list.forEach(function(m){
    var e=evOf(m);
    L.push('BEGIN:VEVENT','UID:'+e.uid,'DTSTAMP:'+now);
    if(e.timed){L.push('DTSTART:'+icsStamp(e.start),'DTEND:'+icsStamp(e.end));}
    else{L.push('DTSTART;VALUE=DATE:'+e.day,'DTEND;VALUE=DATE:'+e.dayEnd);}
    L.push('SUMMARY:'+icsEsc(e.title),'LOCATION:'+icsEsc(e.loc),'DESCRIPTION:'+icsEsc(e.desc));
    if(e.alarm)L.push('BEGIN:VALARM','ACTION:DISPLAY','DESCRIPTION:'+icsEsc('Vérifier si la revente est ouverte : '+e.title),'TRIGGER;VALUE=DATE-TIME:'+icsStamp(e.alarm),'END:VALARM');
    L.push('END:VEVENT');
  });
  L.push('END:VCALENDAR');
  return L.map(icsFold).join('\r\n')+'\r\n';
}
function downloadIcs(list,name){
  if(!list.length){toast('Aucun match à ajouter.');return;}
  try{var b=new Blob([buildIcs(list)],{type:'text/calendar;charset=utf-8'}),u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(function(){URL.revokeObjectURL(u);},4000);toast('Fichier agenda téléchargé : ouvre-le pour l’ajouter.');}
  catch(e){toast('Téléchargement impossible sur cet appareil.');}
}
function card(r){

  if(m.status==='vendue'){px='Vendue';cap=listed!=null?eur(listed):'';}

  if(isPast){

    '<button type="button" class="btn small" data-act="qsold" data-id="'+id+'">Vendue</button></div>';
  function fld(label,field,val,extra){

    return '<div class="fld"><label for="'+fid+'">'+label+'</label><input id="'+fid+'"'+dis+' type="'+(field==='openedOn'?'date':'number')+'" '+(field==='openedOn'?'':'inputmode="decimal" step="0.5" min="0" ')+'data-field="'+field+'" data-id="'+id+'" value="'+esc(val==null?'':val)+'">'+(extra?'<small>'+extra+'</small>':'')+'</div>';
  }

  if(m.updatedBy&&m.updatedAt){var a=ago(m.updatedAt);if(a)info.push('Dernière modification : '+esc(m.updatedBy)+', '+a);}
  if(lockF){

      '<div class="sum"><span class="stub"><b>'+st.day+'</b><i>'+esc(st.mon)+'</i></span>'+
      '<span class="main"><span class="opp">'+logoImg(m.opp)+'<span>'+esc(m.opp)+'</span></span><span class="meta">'+esc(whenLabel(m))+' · <span class="j">'+jLabel(J)+'</span></span></span>'+
      '<span class="side"><span class="pill s-'+esc(m.status)+'">'+esc(m.status==='gardee'&&m.usedBy?'Utilisée':(STATUS_LABEL[m.status]||m.status))+'</span><span class="px">'+esc(px)+'</span>'+(cap?'<span class="cap">'+esc(cap)+'</span>':'')+'</span>'+

function learned(){
  var obs=matches.filter(function(m){return m.openedOn&&m.date;}).map(function(m){return {m:m,j:daysBetween(m.openedOn,m.date)};}).filter(function(o){return o.j>=0;});
  var body;
  if(!obs.length){
    body='<p class="sub">Note la date où le lien « Revente de billets » apparaît sur un match de la billetterie. Après deux ou trois matchs, vous saurez à partir de quel jour surveiller.</p>';
  }else{
    var js=obs.map(function(o){return o.j;}),sum=js.reduce(function(a,b){return a+b;},0);
    var avg=Math.round(sum/js.length),mn=Math.min.apply(null,js),mx=Math.max.apply(null,js);
    body='<p><strong>La revente ouvre en général à J-'+avg+'</strong>'+(js.length>1?' (de J-'+mn+' à J-'+mx+')':'')+'. '+(js.length===1?'Une seule observation, à confirmer. ':'')+'Surveillez chaque jour dès J-'+(mx+2)+'.</p>'+
      '<ul>'+obs.map(function(o){return '<li>'+esc(o.m.opp)+' : vue ouverte à J-'+o.j+'</li>';}).join('')+'</ul>';
  }
  return '<section class="panel stat" aria-labelledby="h-learn"><h2 id="h-learn">Quand la revente ouvre-t-elle ?</h2>'+body+'</section>';
}

function histo(){
  var rows=matches.filter(function(m){return m.openedOn||m.listedOn||m.soldOn||saleOf(m);}).sort(function(a,b){return String(a.date).localeCompare(String(b.date));});
  var jx=function(d,m){return d&&m.date?'J-'+daysBetween(d,m.date):'—';};
  var body;
  if(!rows.length)body='<p class="sub">Rien à afficher pour l’instant. Les dates se remplissent toutes seules quand vous changez le statut d’un match (ouverte, en vente, vendue).</p>';
  else body='<div class="tbl"><table><thead><tr><th scope="col">Match</th><th scope="col">Revente ouverte</th><th scope="col">Mise en vente</th><th scope="col">Vendu</th><th scope="col">Délai</th><th scope="col">Prix affiché</th><th scope="col">Net final</th></tr></thead><tbody>'+rows.map(function(m){
    var sl=saleOf(m),sold=m.soldOn||'',lag=(m.listedOn&&sold)?Math.max(0,daysBetween(m.listedOn,sold))+' j':'—';
    return '<tr><th scope="row">'+esc(m.opp)+'</th><td>'+jx(m.openedOn,m)+'</td><td>'+jx(m.listedOn,m)+'</td><td>'+jx(sold,m)+'</td><td>'+lag+'</td><td>'+eur(m.firstListed!=null?m.firstListed:(m.listed||null))+'</td><td>'+(sl?eur(netOf(sl)):'—')+'</td></tr>';
  }).join('')+'</tbody></table></div><p class="note">J-x = nombre de jours avant le match. Les matchs passés n’ont pas encore ces dates : elles se rempliront à partir des prochains matchs.</p>';
  return '<section class="panel" aria-labelledby="h-histo"><h2 id="h-histo">Historique des reventes</h2>'+body+'</section>';
}

function pushSupported(){return ('Notification' in window)&&('serviceWorker' in navigator)&&('PushManager' in window)&&typeof firebase!=='undefined'&&typeof firebase.messaging==='function';}
function pushStandalone(){return (window.matchMedia&&window.matchMedia('(display-mode: standalone)').matches)||('standalone' in navigator&&navigator.standalone);}
function pushRef(){return db.collection('revente_config').doc('push');}
function pushKeyOf(tok){return String(who||'x')+'_'+tok.slice(-14).replace(/[^A-Za-z0-9_-]/g,'');}
function pushPanel(){
  var on=false;try{on=localStorage.getItem('psg-push')==='1';}catch(e){}
  var h='<details class="panel set" data-key="push"'+(openSet.has('push')?' open':'')+'><summary><span class="h2">Notifications push</span><span class="chev" aria-hidden="true"></span></summary>'+
    '<p class="note">Reçois une notification sur ce téléphone quand une action est à faire (revente à poster, prix à baisser), même appli fermée. Sur iPhone : installe d’abord l’appli sur l’écran d’accueil.</p>';
  if(!pushSupported()){
    h+='<p class="msg-err" role="status">'+(('Notification' in window)?'Ce navigateur ne gère pas les notifications push.':'Notifications indisponibles ici : '+(pushStandalone()?'navigateur non compatible.':'ouvre l’appli installée sur l’écran d’accueil.'))+'</p>';
  }else{
    if(!cfg.vapidKey){
      h+='<div class="fld"><label for="push-vapid">Clé web push (VAPID), à coller une seule fois</label><input id="push-vapid" type="text" autocomplete="off" autocapitalize="off" spellcheck="false"><small>Console Firebase → Paramètres du projet → Cloud Messaging → Certificats Web Push → Générer une paire de clés.</small></div>'+
        '<button type="button" class="btn ghost" data-act="pushkey">Enregistrer la clé</button>';
    }else{
      h+=on?'<p class="note"><b>Activées sur cet appareil.</b></p><button type="button" class="btn ghost" data-act="pushoff">Désactiver sur cet appareil</button>'
           :'<button type="button" class="btn" data-act="pushon"'+(pushMsg&&pushMsg.busy?' disabled':'')+'>Activer les notifications sur cet appareil</button>';
    }
  }
  if(pushMsg&&pushMsg.t)h+='<p class="'+(pushMsg.ok?'note':'msg-err')+'" role="status">'+esc(pushMsg.t)+'</p>';
  return h+'</details>';
}
async function pushOn(){
  pushMsg={busy:true,ok:true,t:'Activation en cours…'};render();
  try{
    var perm=await Notification.requestPermission();
    if(perm!=='granted'){pushMsg={ok:false,t:'Autorisation refusée : active-la dans les réglages du téléphone.'};render();return;}
    var reg=await navigator.serviceWorker.ready;
    var tok=await firebase.messaging().getToken({vapidKey:cfg.vapidKey,serviceWorkerRegistration:reg});
    if(!tok)throw new Error('Aucun jeton reçu');
    var o={};o[pushKeyOf(tok)]={token:tok,who:who,at:new Date().toISOString(),ua:String(navigator.userAgent||'').slice(0,80)};
    await pushRef().set({t:o},{merge:true});
    try{localStorage.setItem('psg-push','1');localStorage.setItem('psg-push-key',pushKeyOf(tok));}catch(e){}
    pushMsg={ok:true,t:'Notifications activées sur cet appareil.'};render();
  }catch(e){
    if(isAuthError(e)){await logout();return;}
    pushMsg={ok:false,t:'Activation impossible : '+(e.message||e.code)};render();
  }
}
async function pushOff(){
  try{
    var k=null;try{k=localStorage.getItem('psg-push-key');}catch(e){}
    if(k)await pushRef().update('t.'+k,firebase.firestore.FieldValue.delete());
    try{await firebase.messaging().deleteToken();}catch(e){}
    try{localStorage.removeItem('psg-push');localStorage.removeItem('psg-push-key');}catch(e){}
    pushMsg={ok:true,t:'Notifications désactivées sur cet appareil.'};
  }catch(e){if(isAuthError(e)){await logout();return;}pushMsg={ok:false,t:'Désactivation impossible : '+(e.message||e.code)};}
  render();
}

    '<div class="fld"><label for="rst-file">Fichier de sauvegarde (.json)</label><input id="rst-file" type="file" accept=".json,application/json"></div>';
  if(rst&&rst.err)h+='<p class="msg-err" role="status">'+esc(rst.err)+'</p>';
  if(rst&&rst.sum){

    h+='<div class="note" role="status"><strong>Aperçu de la sauvegarde</strong> (du '+esc(q.date)+')<br>'+q.matches+' matchs · '+q.ventes+' ventes · '+q.transfers+' virements · '+q.abos+' abonnements<br>'+

  }
  return h+'</details>';

function rstParse(txt){
  var d;try{d=JSON.parse(txt);}catch(e){return {err:'Fichier illisible : ce n’est pas un JSON valide.'};}
  if(!d||typeof d!=='object'||!d.revente_matches||typeof d.revente_matches!=='object'||!d.revente_config||typeof d.revente_config!=='object')return {err:'Ce fichier n’est pas une sauvegarde Revente PSG.'};
  var ids=Object.keys(d.revente_matches);
  if(!ids.length)return {err:'La sauvegarde ne contient aucun match : restauration refusée.'};
  for(var i=0;i<ids.length;i++){var m=d.revente_matches[ids[i]];if(!m||typeof m!=='object'||!m.opp||!m.date)return {err:'Match invalide dans le fichier ('+ids[i]+') : restauration refusée.'};}
  var ok=['main','ventes','abonnements'],cs=Object.keys(d.revente_config);
  for(var j=0;j<cs.length;j++){if(ok.indexOf(cs[j])<0||!d.revente_config[cs[j]]||typeof d.revente_config[cs[j]]!=='object')return {err:'Document de configuration inattendu ('+cs[j]+') : restauration refusée.'};}
  var cv=d.revente_config.ventes||{},ca=d.revente_config.abonnements||{};
  var dt=d.exportedAt?new Date(d.exportedAt):null;
  return {data:d,sum:{date:dt&&!isNaN(dt)?dt.toLocaleString('fr-FR',{timeZone:'Europe/Paris'}):'date inconnue',matches:ids.length,ventes:Object.keys(cv.v||{}).length,transfers:Object.keys(cv.t||{}).length,abos:Object.keys(ca.a||{}).length}};
}
async function rstGo(){
  if(!rst||!rst.data||rst.busy)return;
  rst.busy=true;render();
  try{
    var d=rst.data,b=db.batch();
    Object.keys(d.revente_matches).forEach(function(id){b.set(mref().doc(id),d.revente_matches[id]);});
    Object.keys(d.revente_config).forEach(function(id){b.set(db.collection('revente_config').doc(id),d.revente_config[id]);});
    await b.commit();
    rst=null;openSet.delete('rst');await reload();render();toast('Sauvegarde restaurée.');
  }catch(e){
    if(isAuthError(e)){await logout();return;}
    rst={err:'Restauration impossible : '+(e.message||e.code)};render();
  }
}

/* ---------- finances ---------- */
function seasonOf(d){var p=String(d).split('-').map(Number);var y=p[0],mo=p[1];var a=mo>=8?y:y-1;return a+'-'+String(a+1).slice(2);}
function seasonOfSale(v){var m=v.matchId?matches.filter(function(x){return x.id===v.matchId;})[0]:null;return seasonOf(m&&m.date?m.date:v.date);}
function fiscalOf(d){return String(d).slice(0,4);}
function netOf(v){return Math.round((v.price-v.fee)*100)/100;}
function groupBy(list,fn){
  var g={};
  list.forEach(function(v){var k=fn(v);if(!g[k])g[k]={k:k,n:0,brut:0,fee:0,net:0};g[k].n++;g[k].brut+=v.price;g[k].fee+=v.fee;g[k].net+=netOf(v);});
  return Object.keys(g).sort().reverse().map(function(k){return g[k];});
}
function sortedVentes(){return ventes.slice().sort(function(a,b){return String(b.date).localeCompare(String(a.date))||String(b.id).localeCompare(String(a.id));});}
function tabsNav(){
  return '<nav class="tabs" aria-label="Sections"><button type="button" class="tab" data-act="tab" data-v="matchs" aria-pressed="'+(tab==='matchs')+'">Matchs</button>'+
    '<button type="button" class="tab" data-act="tab" data-v="fin" aria-pressed="'+(tab==='fin')+'">Finances</button></nav>';
}
function sumTable(title,list,keyLabel){
  if(!list.length)return '';
  var tot={n:0,brut:0,fee:0,net:0};list.forEach(function(g){tot.n+=g.n;tot.brut+=g.brut;tot.fee+=g.fee;tot.net+=g.net;});
  function row(g,b){var t=b?'th':'td';return '<tr'+(b?' class="tot"':'')+'><th scope="row">'+esc(g.k)+'</th><td>'+g.n+'</td><td>'+eur(g.brut)+'</td><td>'+eur(g.fee)+'</td><td>'+eur(g.net)+'</td><td>'+eur(g.net/2)+'</td></tr>';}
  return '<section class="panel" aria-label="'+esc(title)+'"><h2>'+esc(title)+'</h2><div class="tbl"><table><thead><tr><th scope="col">'+esc(keyLabel)+'</th><th scope="col">Nb</th><th scope="col">Brut</th><th scope="col">Comm.</th><th scope="col">Net</th><th scope="col">Part ÷2</th></tr></thead><tbody>'+
    list.map(function(g){return row(g);}).join('')+row({k:'Total',n:tot.n,brut:tot.brut,fee:tot.fee,net:tot.net},true)+'</tbody></table></div></section>';
}

var SPLIT='both',SPLIT_LABEL='Les deux (moitié chacun)';
function sellers(){return users().map(function(u){return u.name;});}
function r2(n){return Math.round(n*100)/100;}
function selOpts(sel,blank){var o=blank?'<option value="">— à renseigner —</option><option value="'+SPLIT+'"'+(sel===SPLIT?' selected':'')+'>'+SPLIT_LABEL+'</option>':'';return o+sellers().map(function(n){return '<option value="'+esc(n)+'"'+(n===sel?' selected':'')+'>'+esc(n)+'</option>';}).join('');}
function srcLabel(v){
  if(v.source==='billetterie')return 'Récupérée depuis la billetterie'+(v.edited?' · modifiée à la main par '+v.edited:'')+(v.by?' (importée par '+v.by+')':'');
  return 'Saisie manuelle'+(v.by?' par '+v.by:'');
}
function sellerLabel(v){
  if(!v.seller)return 'à renseigner';
  if(v.seller===SPLIT)return 'les deux : le club verse la moitié à chacun';
  return v.seller+(v.sellerSrc==='billetterie'?' · d’après le titulaire du compte bancaire sur la billetterie':(v.sellerBy?' · saisi par '+v.sellerBy:''));
}
function balance(){
  var us=sellers(),enc={},tin={},tout={},pp={};
  us.forEach(function(n){enc[n]=0;tin[n]=0;tout[n]=0;pp[n]=0;});
  var un=0,pend=0,pendN=0;
  ventes.forEach(function(v){if(v.seller===SPLIT&&us.length){var h=netOf(v)/us.length;us.forEach(function(n){enc[n]+=h;if(v.reglement==='attente')pp[n]+=h;});if(v.reglement==='attente'){pend+=netOf(v);pendN++;}return;}if(enc[v.seller]===undefined){un++;return;}enc[v.seller]+=netOf(v);if(v.reglement==='attente'){pend+=netOf(v);pendN++;pp[v.seller]+=netOf(v);}});
  transfers.forEach(function(t){if(tout[t.from]!==undefined)tout[t.from]+=t.amount;if(tin[t.to]!==undefined)tin[t.to]+=t.amount;});
  var tot=us.reduce(function(s,n){return s+enc[n];},0),fair=us.length?tot/us.length:0;
  return {un:un,pend:pend,pendN:pendN,tot:tot,fair:fair,rows:us.map(function(n){return {n:n,enc:enc[n],pend:pp[n],out:tout[n],inn:tin[n],bal:r2(enc[n]-tout[n]+tin[n]-fair)};})};
}

  h+='<p class="verdict">'+msg+'</p>';

  h+='<p class="note"><b>Total net des reventes : '+eur(b.tot)+'</b> · part de chacun : <b>'+eur(b.fair)+'</b> ('+sellers().length+' personnes).'+(b.pendN?' Dont '+eur(b.pend)+' pas encore versés par le club ('+b.pendN+' vente'+(b.pendN>1?'s':'')+') : ils sont comptés pour celui qui va les recevoir.':'')+'</p>';
  h+='<div class="tbl"><table><thead><tr><th scope="col">Qui</th><th scope="col">Net reçu</th><th scope="col">Viré</th><th scope="col">Reçu</th><th scope="col">Solde</th></tr></thead><tbody>'+
    b.rows.map(function(r){return '<tr><th scope="row">'+esc(r.n)+'</th><td>'+eur(r.enc)+(r.pend>0?'<br><small class="muted">dont '+eur(r.pend)+' à recevoir</small>':'')+'</td><td>'+eur(r.out)+'</td><td>'+eur(r.inn)+'</td><td>'+(r.bal>0.005?'doit '+eur(r.bal):r.bal<-0.005?'reçoit '+eur(-r.bal):'0 €')+'</td></tr>';}).join('')+'</tbody></table></div>';
  h+='<p class="note">Au PSG, le club verse en général la moitié à chaque propriétaire de place : ces ventes (« Les deux ») ne créent aucune dette. Quand le club verse tout à une seule personne, c’est elle qui doit la moitié à l’autre. Net reçu = part du net que la personne a reçue du club, règlements en attente compris. Solde = net reçu − virements faits + virements reçus − part de chacun. Le solde est donc le montant à virer, qu’un règlement du club soit encore en attente ou non.</p>';
  var us=sellers();
  h+='<details class="panel set" data-key="addt"'+(openSet.has('addt')?' open':'')+'><summary><span class="h2">Enregistrer un virement entre nous</span><span class="chev" aria-hidden="true"></span></summary>'+
    '<form id="tr-form" style="display:flex;flex-direction:column;gap:12px"><div class="grid">'+
    '<div class="fld"><label for="t-from">Qui a viré</label><select id="t-from">'+selOpts(who,false)+'</select></div>'+
    '<div class="fld"><label for="t-to">À qui</label><select id="t-to">'+selOpts(us.filter(function(n){return n!==who;})[0]||'',false)+'</select></div>'+
    '<div class="fld"><label for="t-amt">Montant (€)</label><input id="t-amt" type="number" inputmode="decimal" step="0.01" min="0" required></div>'+
    '<div class="fld"><label for="t-date">Date</label><input id="t-date" type="date" value="'+parisToday()+'" required></div></div>'+
    '<div class="fld"><label for="t-note">Note</label><input id="t-note" type="text"></div>'+
    '<button type="submit" class="btn">Enregistrer le virement</button></form></details>';
  if(transfers.length){
    h+='<div class="vlist">'+transfers.map(function(t){return '<div class="vrow"><div class="vhead"><b>'+esc(t.from)+' → '+esc(t.to)+' · '+eur(t.amount)+'</b><span class="muted">'+esc(t.date)+(t.note?' · '+esc(t.note):'')+(t.by?' · saisi par '+esc(t.by):'')+'</span></div><button type="button" class="btn ghost small" data-act="deltr" data-id="'+esc(t.id)+'">Supprimer ce virement</button></div>';}).join('')+'</div>';
  }
  return h+'</section>';
}

/* ---------- rentabilité de l'abonnement ---------- */
var MOIS=['Janv','Févr','Mars','Avr','Mai','Juin','Juil','Août','Sept','Oct','Nov','Déc'];
function seasonStart(s){var y=Number(String(s).slice(0,4));return Date.UTC(y,7,1);}
function seasonEnd(s){var y=Number(String(s).slice(0,4));return Date.UTC(y+1,6,31);}
function roiOf(abo){
  var n=Math.max(1,sellers().length),sales=ventes.filter(function(v){return seasonOfSale(v)===abo.season;}).sort(function(x,y){return String(x.date).localeCompare(String(y.date));});
  var net=0,pend=0;sales.forEach(function(v){net+=netOf(v);if(v.reglement==='attente')pend+=netOf(v);});
  var share=r2(net/n);
  return {abo:abo,sales:sales,net:net,share:share,pend:r2(pend/n),n:n,pct:abo.amount>0?share/abo.amount*100:0,left:r2(abo.amount-share)};
}
function roiChart(R){
  var W=340,H=190,L=40,Rr=10,T=14,B=26,pw=W-L-Rr,ph=H-T-B,s=R.abo.season,t0=seasonStart(s),t1=seasonEnd(s),cost=R.abo.amount,n=R.n;
  var todayT=Date.parse(parisToday()+'T00:00:00Z'),tEnd=Math.min(Math.max(todayT,t0),t1);
  var cum=0,pts=[[t0,0]],dots=[],be=null;
  R.sales.forEach(function(v){var t=Date.parse(v.date+'T00:00:00Z');pts.push([t,cum]);cum+=netOf(v)/n;pts.push([t,cum]);dots.push({t:t,c:cum});if(be===null&&cost>0&&cum>=cost)be={t:t,c:cum};});
  pts.push([Math.max(tEnd,pts[pts.length-1][0]),cum]);
  var ymax=Math.max(cost,cum)*1.15||100;
  function X(t){return L+(t-t0)/(t1-t0)*pw;}function Y(c){return T+ph-c/ymax*ph;}
  var d=pts.map(function(p,i){return (i?'L':'M')+X(p[0]).toFixed(1)+' '+Y(p[1]).toFixed(1);}).join(' ');
  var last=pts[pts.length-1],area=d+' L'+X(last[0]).toFixed(1)+' '+Y(0).toFixed(1)+' L'+X(t0).toFixed(1)+' '+Y(0).toFixed(1)+' Z';
  var g='',ticks=[0,0.5,1].map(function(f){return cost*f;});if(!cost)ticks=[0,ymax/2];
  ticks.forEach(function(c){g+='<line class="g" x1="'+L+'" x2="'+(W-Rr)+'" y1="'+Y(c).toFixed(1)+'" y2="'+Y(c).toFixed(1)+'"/><text class="yl" x="'+(L-5)+'" y="'+(Y(c)+3).toFixed(1)+'" text-anchor="end">'+Math.round(c)+' €</text>';});
  var xl='';for(var k=0;k<12;k++){var mo=(7+k)%12,yr=Number(s.slice(0,4))+(7+k>11?1:0),tt=Date.UTC(yr,mo,1);var x=X(tt).toFixed(1);xl+='<line class="g" x1="'+x+'" x2="'+x+'" y1="'+(T+ph)+'" y2="'+(T+ph+3)+'"/>'+(k%3===0?'<text class="yl" x="'+x+'" y="'+(H-8)+'">'+MOIS[mo]+'</text>':'');}
  var cl=cost?'<line class="cost" x1="'+L+'" x2="'+(W-Rr)+'" y1="'+Y(cost).toFixed(1)+'" y2="'+Y(cost).toFixed(1)+'"/><text class="cl" x="'+(W-Rr)+'" y="'+(Y(cost)-4).toFixed(1)+'" text-anchor="end">Abonnement '+eur(cost)+'</text>':'';
  var dt=dots.map(function(p){return '<circle class="dt" cx="'+X(p.t).toFixed(1)+'" cy="'+Y(p.c).toFixed(1)+'" r="3.5"/>';}).join('');
  var bm=be?'<circle class="be" cx="'+X(be.t).toFixed(1)+'" cy="'+Y(cost).toFixed(1)+'" r="6"/>':'';
  var lbl='Courbe de remboursement de l’abonnement '+s+' : '+eur(R.share)+' revendus sur '+eur(cost)+'.';
  return '<svg class="rchart" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="'+esc(lbl)+'">'+g+xl+'<path class="ar" d="'+area+'"/>'+cl+'<path class="ln" d="'+d+'"/>'+dt+bm+'</svg>';
}
function roiCard(R){
  var a=R.abo,done=R.share>=a.amount&&a.amount>0,pct=Math.min(100,R.pct);
  var verdict=!a.amount?'Montant de l’abonnement à renseigner.':done?'Abonnement amorti : <b>+'+eur(r2(R.share-a.amount))+'</b> de gain.':'Il reste <b>'+eur(R.left)+'</b> à rembourser.';
  var locked=a.source==='billetterie';
  var h='<section class="panel roi" aria-label="Rentabilité '+esc(a.person)+' '+esc(a.season)+'"><div class="roih"><h2>Saison '+esc(a.season)+' · '+esc(a.person)+'</h2>'+(locked?'<span class="src bil"><span class="lockic" role="img" aria-label="Verrouillé">'+LOCK_SVG+'</span> '+(a.ref?'Commande n° '+esc(a.ref)+' · ':'')+'billetterie</span>':'<span class="src man">Informations saisies manuellement'+(a.by?' (par '+esc(a.by)+')':'')+'</span>')+'</div>'+
    '<div class="roip"><b class="big'+(done?' ok':'')+'">'+Math.round(R.pct)+' %</b><span class="cap">de l’abonnement remboursé</span></div>'+
    '<div class="bar" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="'+Math.round(pct)+'"><i class="'+(done?'ok':'')+'" style="width:'+pct.toFixed(1)+'%"></i></div>'+
    '<p class="verdict">'+verdict+'</p>'+
    '<div class="kpis"><div><span class="cap">Abonnement</span><b class="big">'+eur(a.amount)+'</b></div><div><span class="cap">Part revendue</span><b class="big">'+eur(R.share)+'</b></div><div><span class="cap">Paires vendues</span><b class="big">'+R.sales.length+'</b></div></div>'+
    roiChart(R)+
    '<p class="note">Part revendue = net des reventes de la saison ÷ '+R.n+' personnes (la recette est partagée à parts égales).'+(R.pend>0?' Dont '+eur(R.pend)+' en attente de règlement par le club.':'')+'</p>';
  if(!locked)h+='<button type="button" class="btn ghost small" data-act="delabo" data-id="'+esc(a.id)+'">Supprimer cet abonnement</button>';
  return h+'</section>';
}
function roiView(){
  var h='';

function statsData(){
  var rows=ventes.map(function(v){var m=v.matchId?matches.filter(function(x){return x.id===v.matchId;})[0]:null;return {v:v,m:m,gross:v.price,net:netOf(v)};}).filter(function(r){return r.gross>0;});

async function importVentes(text){
  var lines=String(text||'').split(/\r?\n/).map(function(x){return x.trim();}).filter(Boolean);
  var o={},bad=0,dup=0;
  lines.forEach(function(l){
    var c=l.split(';').map(function(x){return x.trim();});
    if(c.length<4||!/^\d{4}-\d{2}-\d{2}$/.test(c[0])){bad++;return;}
    var lot=c[4]||'';var id=lot?('vlot'+lot.replace(/\W/g,'')):('v'+Date.now().toString(36)+Math.random().toString(36).slice(2,5));
    if(ventes.some(function(v){return v.id===id;})||o[id]){dup++;return;}
    o[id]={date:c[0],label:c[1],matchId:autoMatchId(c[0],c[1]),price:num(c[2])||0,fee:num(c[3])||0,note:lot?('Lot '+lot):'',by:who,seller:(document.getElementById('imp-seller')||{}).value||'',sellerSrc:'manuel',sellerBy:who,reglement:'verse',source:lot?'billetterie':'manuel'};
  });
  var ids=Object.keys(o);
  if(!ids.length){toast(bad?'Aucune ligne valide (format : date;libellé;prix;commission;lot).':'Rien de nouveau à importer.');return;}
  ids.forEach(function(k){var r=o[k];r.id=k;ventes.push(r);});
  openSet.delete('imp');render();
  try{await vref().set({v:o},{merge:true});toast(ids.length+' vente(s) importée(s)'+(dup?', '+dup+' déjà présente(s)':'')+(bad?', '+bad+' ligne(s) ignorée(s)':'')+'.');}
  catch(e){if(isAuthError(e)){await logout();return;}toast('Import impossible : '+(e.message||e.code));await refresh();}
}

function psgNotify(){
  if(!('Notification' in window)||!('serviceWorker' in navigator))return;
  var isStandalone=(window.matchMedia&&window.matchMedia('(display-mode: standalone)').matches)||('standalone' in navigator&&navigator.standalone);
  if(!isStandalone)return;
  var today=new Date();today.setHours(0,0,0,0);
  var in7=new Date(today.getTime()+7*24*60*60*1000);
  var soon=matches.filter(function(m){
    if(!m.date)return false;
    var d=new Date(m.date+'T12:00:00');
    return d>=today&&d<=in7&&m.status!=='vendue'&&m.status!=='nonvendue';
  });
  if(!soon.length)return;
  if(Notification.permission==='granted'){
    _psgSendNotify(soon);
  }else if(Notification.permission==='default'){
    Notification.requestPermission().then(function(p){
      if(p==='granted')_psgSendNotify(soon);
    });
  }
}
function _psgSendNotify(soon){
  navigator.serviceWorker.ready.then(function(reg){
    reg.active&&reg.active.postMessage({type:'PSG_NOTIFY',matches:soon});
  }).catch(function(){});
}
function psgUpdateManifest(){
  try{
    var today=new Date();today.setHours(0,0,0,0);
    var upcoming=matches.filter(function(m){
      if(!m.date)return false;
      var d=new Date(m.date+'T12:00:00');
      return d>=today&&m.status!=='vendue'&&m.status!=='nonvendue';
    }).sort(function(a,b){return String(a.date).localeCompare(String(b.date));}).slice(0,2);
    var shortcuts=upcoming.map(function(m){
      var d=new Date(m.date+'T12:00:00');
      var label=d.toLocaleDateString('fr-FR',{day:'numeric',month:'short'});
      return {name:m.opp+' · '+label,short_name:m.opp,url:'/revente-psg/',icons:[{src:'/revente-psg/icons/icon-192.png',sizes:'192x192'}]};
    });
    if(!shortcuts.length){
      shortcuts=[{name:'Matchs à venir',short_name:'Matchs',url:'/revente-psg/',icons:[{src:'/revente-psg/icons/icon-192.png',sizes:'192x192'}]},{name:'Finances',short_name:'Finances',url:'/revente-psg/#finances',icons:[{src:'/revente-psg/icons/icon-192.png',sizes:'192x192'}]}];
    }
    var manifest={name:'Revente PSG',short_name:'Revente PSG',start_url:'/revente-psg/',scope:'/revente-psg/',display:'standalone',background_color:'#0a1f45',theme_color:'#0b3a82',lang:'fr',icons:[{src:'/revente-psg/icons/icon-192.png',sizes:'192x192',type:'image/png',purpose:'any maskable'},{src:'/revente-psg/icons/icon-512.png',sizes:'512x512',type:'image/png',purpose:'any maskable'}],shortcuts:shortcuts};
    var blob='data:application/manifest+json,'+encodeURIComponent(JSON.stringify(manifest));
    var link=document.querySelector('link[rel="manifest"]');
    if(link)link.href=blob;
  }catch(e){}
}

  if(act==='theme'){var d=!isDark();if(d)document.documentElement.setAttribute('data-theme','dark');else document.documentElement.removeAttribute('data-theme');try{localStorage.setItem('psg-theme',d?'dark':'light');}catch(_){}var mt=document.querySelector('meta[name=theme-color]');if(mt)mt.content=d?'#0a111e':'#1c4fd8';t.setAttribute('aria-checked',d);var l=t.querySelector('.swl');if(l)l.textContent=d?'Sombre':'Clair';return;}
  if(act==='view'){fullView=!fullView;try{localStorage.setItem('psg-view',fullView?'full':'simple');}catch(_){}render();return;}
  if(act==='delabo'){
    var da=abos.filter(function(x){return x.id===id;})[0];
    if(da&&da.source==='billetterie'){toast('Verrouillé : abonnement récupéré depuis la billetterie.');return;}
    abos=abos.filter(function(x){return x.id!==id;});render();
    try{await aref().update('a.'+id,firebase.firestore.FieldValue.delete());}
    catch(e){if(isAuthError(e)){await logout();return;}toast('Suppression impossible : '+(e.message||e.code));await refresh();}
    return;
  }
  if(act==='deltr'){
    transfers=transfers.filter(function(x){return x.id!==id;});render();
    try{await vref().update('t.'+id,firebase.firestore.FieldValue.delete());}
    catch(e){if(isAuthError(e)){await logout();return;}toast('Suppression impossible : '+(e.message||e.code));await refresh();}
    return;
  }
  if(act==='copy'){copyText(t.dataset.v);return;}
  if(act==='open'){
    openSet.add(id);render();
    var el=document.getElementById('fx-'+id);
    if(el){var calm=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;el.scrollIntoView({behavior:calm?'auto':'smooth',block:'start'});}
    return;
  }
  if(act==='logout'){await logout();return;}
  if(act==='rstno'){rst=null;render();return;}
  if(act==='pushon'){await pushOn();return;}
  if(act==='pushoff'){await pushOff();return;}
  if(act==='pushkey'){var pk=((document.getElementById('push-vapid')||{}).value||'').trim();if(pk.length<60||/\s/.test(pk)){pushMsg={ok:false,t:'Clé invalide : colle la clé publique complète.'};render();return;}pushMsg=null;patchCfg({vapidKey:pk});toast('Clé enregistrée.');return;}
  if(act==='rstgo'){await rstGo();return;}
  if(act==='retry'){syncErr=false;await startApp();return;}
  if(act==='tab'){tab=t.dataset.v==='fin'?'fin':'matchs';render();window.scrollTo(0,0);return;}
  if(act==='export'){exportXlsx();return;}
  if(!db||state!=='ok')return;
  if(act==='check'){patchCfg({lastCheck:new Date().toISOString(),lastCheckBy:who});toast('Vérification notée.');return;}
  if(act==='icsall'){downloadIcs(matches.filter(function(x){return x.date&&daysBetween(parisToday(),x.date)>=0;}).sort(function(a,b){return String(a.date).localeCompare(String(b.date));}),'paris-fc-domicile.ics');return;}
  if(act==='ics'){var im=find(id);if(im)downloadIcs([im],'paris-fc-'+String(im.opp).toLowerCase().replace(/[^a-z0-9]+/g,'-')+'.ics');return;}
  if(act==='share'){var sm=find(id);if(sm&&'share' in navigator){var shareDate=sm.date?new Date(sm.date+'T12:00:00').toLocaleDateString('fr-FR',{day:'numeric',month:'long'}):'';var shareTxt='PSG – '+sm.opp+(shareDate?' · '+shareDate:'')+(sm.listed?' · Place dispo à '+sm.listed+' €':'');navigator.share({title:'PSG – '+sm.opp,text:shareTxt,url:location.href}).catch(function(){});}return;}
  if(act==='import'){var ta=document.getElementById('imp-text');importVentes(ta?ta.value:'');return;}
  if(act==='delvente'){var dv=ventes.filter(function(x){return x.id===id;})[0];if(dv&&dv.source==='billetterie'){toast('Vente verrouillée : données récupérées depuis la billetterie.');return;}deleteVente(id);return;}
  var m=find(id);if(!m)return;
  if(lockFull(m)||(lockFin(m)&&(act==='posted'||act==='sold'))){toast('Fiche verrouillée.');return;}
  if(act==='status'){
    var v=t.dataset.v,patch={status:v},prev=m.status;
    if(m.status==='attente'&&(v==='ouverte'||v==='enligne')&&!m.openedOn)patch.openedOn=parisToday();
    if(v==='enligne'&&m.status!=='enligne')patch.postedBy=who;
    if(v==='enligne'&&!m.listedOn)patch.listedOn=parisToday();
    if(v==='vendue'&&!m.soldOn)patch.soldOn=parisToday();
    patchMatch(id,patch);
    if(v==='vendue'&&prev!=='vendue')ensureSale(m);
  }else if(act==='posted'){
    var p2={status:'enligne',listed:Number(t.dataset.v)};
    if(!m.openedOn)p2.openedOn=parisToday();
    if(m.status!=='enligne')p2.postedBy=who;
    if(!m.listedOn)p2.listedOn=parisToday();
    if(m.firstListed==null)p2.firstListed=Number(t.dataset.v);
    patchMatch(id,p2);
  }else if(act==='qsold'){
    var qp=num((document.getElementById('qp-'+id)||{}).value),qfv=num((document.getElementById('qf-'+id)||{}).value),qf=qfv==null?(qp&&RATE?r2(qp*RATE):0):qfv;
    if(!qp||qp<=0){toast('Indique le prix de vente.');return;}
    if(qf<0||qf>=qp){toast('Commission incohérente avec le prix.');return;}
    patchMatch(id,m.soldOn?{status:'vendue',listed:qp}:{status:'vendue',soldOn:parisToday(),listed:qp});
    if(!ventes.some(function(v){return isSaleOf(v,m);})){newSale({date:parisToday(),label:'PSG – '+m.opp,matchId:m.id,price:qp,fee:qf});toast('Vente notée : net '+eur(qp-qf)+'.');}
  }else if(act==='sold'){
    patchMatch(id,m.soldOn?{status:'vendue'}:{status:'vendue',soldOn:parisToday()});
    ensureSale(m);
  }
});
app.addEventListener('change',function(e){
  var t=e.target;if(!db||state!=='ok')return;
  if(t.id==='rst-file'){
    var fl=t.files&&t.files[0];if(!fl){return;}
    if(fl.size>5*1024*1024){rst={err:'Fichier trop volumineux pour une sauvegarde.'};openSet.add('rst');render();return;}
    var rd=new FileReader();rd.onload=function(){rst=rstParse(String(rd.result||''));openSet.add('rst');render();};rd.onerror=function(){rst={err:'Lecture du fichier impossible.'};openSet.add('rst');render();};rd.readAsText(fl);return;
  }
  if(t.dataset.vf){
    var vv=ventes.filter(function(x){return x.id===t.dataset.vid;})[0];if(!vv)return;
    var nv=Object.assign({},vv),ff=t.dataset.vf;
    if(lockedVente(vv,ff)){toast('Verrouillé : données récupérées depuis la billetterie.');render();return;}
    if(ff==='price'||ff==='fee')nv[ff]=num(t.value)||0;else if(ff==='date'){if(!t.value)return;nv[ff]=t.value;}else nv[ff]=t.value;
    if(ff==='seller'){nv.sellerSrc='manuel';nv.sellerBy=who;}
    if(nv.source==='billetterie'&&(ff==='price'||ff==='fee'||ff==='date'))nv.edited=who;
    saveVente(nv);return;
  }
  if(t.dataset.field){
    var lm=find(t.dataset.id);if(lm&&(lockFull(lm)||(lockFin(lm)&&(t.dataset.field==='paid'||t.dataset.field==='floor'||t.dataset.field==='listed')))){toast('Fiche verrouillée.');render();return;}
    var f=t.dataset.field,v=(f==='openedOn')?(t.value||null):num(t.value),patch={};patch[f]=v;
    patchMatch(t.dataset.id,patch);
  }else if(t.dataset.cfg){
    var c={};c[t.dataset.cfg]=num(t.value);patchCfg(c);
  }
});
app.addEventListener('submit',async function(e){
  e.preventDefault();
  var f=e.target;
  if(f.id==='vente-form'){
    if(!db||state!=='ok')return;
    var mid=document.getElementById('v-match').value,mm=find(mid);
    var label=mm?('PSG – '+mm.opp):(document.getElementById('v-label').value.trim()||'Vente');
    var d=document.getElementById('v-date').value;if(!d)return;
    openSet.delete('addv');
    await newSale({date:d,label:label,matchId:mid||null,price:document.getElementById('v-price').value,fee:document.getElementById('v-fee').value,note:document.getElementById('v-note').value.trim(),seller:document.getElementById('v-seller').value});
    toast('Vente enregistrée.');return;
  }
  if(f.id==='abo-form'){
    if(!db||state!=='ok')return;
    var as=document.getElementById('a-season').value,ap=document.getElementById('a-person').value,am2=num(document.getElementById('a-amt').value);
    if(!as||!ap||!am2||am2<=0){toast('Abonnement : choisis la saison, la personne et un montant.');return;}
    var ar={id:'a'+Date.now().toString(36)+Math.random().toString(36).slice(2,5),season:as,person:ap,amount:am2,ref:document.getElementById('a-ref').value.trim(),source:'manuel',by:who};
    abos.push(ar);abos.sort(function(x,y){return String(y.season).localeCompare(String(x.season))||String(x.person).localeCompare(String(y.person));});openSet.delete('addabo');render();
    var ao={};ao[ar.id]=ar;
    try{await aref().set({a:ao},{merge:true});toast('Abonnement enregistré.');}
    catch(e){if(isAuthError(e)){await logout();return;}toast('Enregistrement impossible : '+(e.message||e.code));await refresh();}
    return;
  }
  if(f.id==='tr-form'){
    if(!db||state!=='ok')return;
    var tf=document.getElementById('t-from').value,tt=document.getElementById('t-to').value,ta=num(document.getElementById('t-amt').value),td=document.getElementById('t-date').value;
    if(!tf||!tt||tf===tt||!ta||ta<=0||!td){toast('Virement : choisis deux personnes différentes et un montant.');return;}
    var tr={id:'t'+Date.now().toString(36)+Math.random().toString(36).slice(2,5),from:tf,to:tt,amount:ta,date:td,note:document.getElementById('t-note').value.trim(),by:who};
    transfers.unshift(tr);openSet.delete('addt');render();
    var to={};to[tr.id]=tr;
    try{await vref().set({t:to},{merge:true});toast('Virement enregistré.');}
    catch(e){if(isAuthError(e)){await logout();return;}toast('Enregistrement impossible : '+(e.message||e.code));await refresh();}
    return;
  }
  if(f.id==='login-form'){
    var pw=document.getElementById('pw').value;if(!pw)return;
    var btn=f.querySelector('button[type="submit"]');if(btn)btn.disabled=true;
    var em=document.getElementById('usr').value;selUser=em;
    try{await auth.signInWithEmailAndPassword(em,pw);}
    catch(err){
      loginErr=/credential|password|user-not-found|invalid/i.test(err.code||'')?'Mot de passe incorrect.':'Connexion impossible : '+(err.message||err.code);
      render();return;
    }
    who=whoFromEmail(em);
    try{localStorage.setItem('psg_last_user',em);}catch(x){}
    loginErr='';await afterLogin();
  }else if(f.id==='pw-form'){
    var cur=document.getElementById('pw-cur').value,n1=document.getElementById('pw-new').value,n2=document.getElementById('pw-new2').value;
    if(n1.length<8){pwMsg={ok:false,t:'Le nouveau mot de passe doit faire au moins 8 caractères.'};render();return;}
    if(n1!==n2){pwMsg={ok:false,t:'Les deux nouveaux mots de passe ne sont pas identiques.'};render();return;}
    if(n1===cur){pwMsg={ok:false,t:'Le nouveau mot de passe doit être différent de l’actuel.'};render();return;}
    var u=auth.currentUser;
    try{
      await u.reauthenticateWithCredential(firebase.auth.EmailAuthProvider.credential(u.email,cur));
      await u.updatePassword(n1);
      pwMsg=null;openSet.delete('pw');render();toast('Mot de passe modifié.');
    }catch(err){
      var c=err&&err.code||'';
      pwMsg={ok:false,t:/credential|password|invalid/i.test(c)&&!/weak/.test(c)?'Mot de passe actuel incorrect.':(/weak/.test(c)?'Mot de passe trop faible : choisis-en un plus long.':'Changement impossible : '+(err.message||c))};
      openSet.add('pw');render();
    }
  }
});
app.addEventListener('toggle',function(e){
  var k=e.target&&e.target.dataset&&e.target.dataset.key;if(!k)return;
  if(e.target.open)openSet.add(k);else openSet.delete(k);
},true);

/* ---------- démarrage ---------- */
function configured(){
  function ok(v){return v&&String(v).indexOf('VOTRE')<0;}
  return !!CFGX.FIREBASE&&ok(CFGX.FIREBASE.apiKey)&&users().length>0;
}
(function init(){
  if(!configured()){state='setup';render();return;}
  if(!window.firebase||!firebase.initializeApp){
    state='error';errMsg='La bibliothèque Firebase ne s’est pas chargée. Vérifie ta connexion et recharge la page.';render();return;
  }
  if(!firebase.apps.length)firebase.initializeApp(CFGX.FIREBASE);
  auth=firebase.auth();db=firebase.firestore();
  try{var pp=db.enablePersistence({synchronizeTabs:true});if(pp&&pp.catch)pp.catch(function(){});}catch(e){}
  var first=true;
  auth.onAuthStateChanged(function(u){
    if(!first)return;first=false;
    if(u){who=whoFromEmail(u.email);afterLogin();}else{state='login';render();}
  });
})();
})();

<!-- ── PWA install banner ── -->
<div id="pwaBar" style="position:fixed;bottom:0;left:0;right:0;z-index:30;padding:12px max(16px,env(safe-area-inset-left,0px)) calc(12px + env(safe-area-inset-bottom,0px));background:var(--bg);border-top:1px solid var(--line);display:none;flex-direction:column;gap:8px">
  <button id="pwaInstall" type="button">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2v13M7 10l5 5 5-5"/><rect x="3" y="17" width="18" height="4" rx="1"/></svg>
    Installer l'application
  </button>
  <div id="iosHint">
    <strong>Installer sur iPhone / iPad</strong><br>
    Appuyez sur <strong>Partager</strong> <span aria-hidden="true">⎙</span> puis <strong>Sur l'écran d'accueil</strong>
  </div>
</div>
<script>
(function(){
  /* ── Bandeau hors-ligne ── */
  function syncOfflineBanner(){
    var b=document.getElementById('offlineBanner');
    if(!b)return;
    if(navigator.onLine){b.classList.remove('visible');}
    else{b.classList.add('visible');}
  }
  syncOfflineBanner();
  window.addEventListener('online',syncOfflineBanner);
  window.addEventListener('offline',syncOfflineBanner);

  /* ── Service Worker ── */
  if('serviceWorker' in navigator){
    window.addEventListener('load',function(){
      navigator.serviceWorker.register('/revente-psg/sw.js',{scope:'/revente-psg/'})
        .catch(function(){});
    });
  }

  /* ── Install prompt (Android / Desktop) ── */
  var deferredPrompt=null;
  window.addEventListener('beforeinstallprompt',function(e){
    e.preventDefault();
    deferredPrompt=e;
    var bar=document.getElementById('pwaBar');
    var btn=document.getElementById('pwaInstall');
    if(bar&&btn){bar.style.display='flex';btn.classList.add('visible');}
  });

  document.addEventListener('click',function(e){
    if(e.target&&e.target.id==='pwaInstall'&&deferredPrompt){
      deferredPrompt.prompt();
      deferredPrompt.userChoice.then(function(){deferredPrompt=null;});
      var bar=document.getElementById('pwaBar');
      if(bar)bar.style.display='none';
    }
  });

  window.addEventListener('appinstalled',function(){
    var bar=document.getElementById('pwaBar');
    if(bar)bar.style.display='none';
    deferredPrompt=null;
  });

  /* ── iOS Safari hint ── */
  var isIOS=/iphone|ipad|ipod/i.test(navigator.userAgent);
  var isSafari=/^((?!chrome|android).)*safari/i.test(navigator.userAgent);
  var isStandalone=('standalone' in navigator&&navigator.standalone);
  if(isIOS&&isSafari&&!isStandalone){
    var bar=document.getElementById('pwaBar');
    var hint=document.getElementById('iosHint');
    if(bar&&hint){bar.style.display='flex';hint.classList.add('visible');}
  }
})();
</script>
